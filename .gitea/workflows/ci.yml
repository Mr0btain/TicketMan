# Tests and doc checks on every pull request, and on pushes to master.
# See docs/testing.md for what each test task covers.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Doc checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API pages match the routes
        run: python3 scripts/check_api_docs.py
      - name: Links and anchors resolve
        run: python3 scripts/check_doc_links.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # For the Android compile at the end, with the compileSdk platform (gradle/libs.versions.toml). The tests don't
      # need it
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Server tests
        run: ./gradlew :server:test

      - name: Shared tests
        run: ./gradlew :shared:jvmTest

      # Skia's native library links against these even when it draws without a display, and the runner image leaves
      # them out
      - name: Skia libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-6 libfontconfig1

      # Includes the render tests and UiKitRulesTest. Compose draws with Skia's software renderer, no display needed
      - name: Client tests
        run: ./gradlew :composeApp:desktopTest

      - name: Web and Android compile
        run: ./gradlew :composeApp:compileKotlinWasmJs :composeApp:compileAndroidMain

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: |
            server/build/reports/tests/
            shared/build/reports/tests/
            composeApp/build/reports/tests/

      # The main screens and the kit gallery drawn to PNGs, to look over a UI change without running the app
      - name: Screen renders
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: screen-renders
          path: |
            composeApp/build/screen-renders/
            composeApp/build/kit-gallery/
