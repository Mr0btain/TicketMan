# Builds the Linux packages (the arm64 DEB emulated through QEMU), the Windows MSI and the jars, and publishes a Gitea release
# when a v* tag is pushed (git tag v0.8.0 && git push origin v0.8.0). Run it by hand to build without publishing. The
# macOS DMG needs a Mac runner, which .github/workflows/release.yml has on GitHub. See docs/releasing.md
#
# Gitea only runs actions/upload-artifact and download-artifact v3, not v4
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_arm64:
        description: Skip the arm64 DEB (it's emulated, so slow)
        type: boolean
        default: false
      skip_amd64:
        description: Skip the amd64 DEB and the APK
        type: boolean
        default: false
      skip_windows:
        description: Skip the Windows MSI (needs the windows-latest runner online)
        type: boolean
        default: false
      skip_tarball:
        description: Skip the Linux tarballs (the desktop app unpacked, beside each DEB)
        type: boolean
        default: false
      skip_desktop_jar:
        description: Skip the desktop jar
        type: boolean
        default: false
      skip_server_web:
        description: Skip the server with the web client (saves the few minute Wasm build)
        type: boolean
        default: false
      skip_server_noweb:
        description: Skip the server without the web client
        type: boolean
        default: false
      skip_server_jars:
        description: Skip the server jars (the zips and images are still built)
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^ticketman.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ticketman.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The APK and DEB are built on x86: the AAPT2 Gradle downloads doesn't run on ARM Linux, and the DEB is for the
  # runner's own architecture. Beside the DEB goes a tarball of the same app (bin/TicketMan to start it) for systems
  # without dpkg, skipped by the skip_tarball input of a run by hand, or for tags by setting SKIP_TARBALL to true
  packages:
    name: Desktop DEB and Android APK
    needs: version
    if: format('{0}', inputs.skip_amd64) != 'true' && vars.SKIP_AMD64 != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      # jpackage makes the DEB with these
      - name: Packaging tools
        run: command -v fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TICKETMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The build names each file (TicketMan-Linux-<version>-x64.deb, TicketMan-Android-<version>.apk, see
      # docs/releasing.md), so they're only collected
      - name: Build
        env:
          TICKETMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TICKETMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TICKETMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SKIP_TARBALL: ${{ format('{0}', inputs.skip_tarball) == 'true' || vars.SKIP_TARBALL == 'true' }}
        run: |
          tarball=$([ "$SKIP_TARBALL" = "true" ] || echo :composeApp:packageTarball)
          ./gradlew :composeApp:packageDeb $tarball :androidApp:assembleRelease
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/TicketMan-*.deb dist/
          if [ -n "$tarball" ]; then cp composeApp/build/compose/binaries/main/tar/TicketMan-*.tar.gz dist/; fi
          cp androidApp/build/outputs/apk/release/TicketMan-*.apk dist/

      - uses: actions/upload-artifact@v3
        with:
          name: packages
          path: dist/

  # The Compose desktop app bundles a Java runtime and native graphics for the machine that builds it, so the arm64
  # DEB (and its tarball, see packages) is built in an arm64 container emulated through QEMU (docker/deb.Dockerfile).
  # Needs a runner with Docker access. It's skipped by the skip_arm64 input of a run by hand, or for tags by setting the
  # SKIP_ARM64 variable to true
  deb-arm64:
    name: Desktop DEB (arm64)
    needs: version
    if: format('{0}', inputs.skip_arm64) != 'true' && vars.SKIP_ARM64 != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Built through the host's Docker daemon, so the result comes back with --output rather than a mounted folder
      - name: Package
        env:
          SKIP_TARBALL: ${{ format('{0}', inputs.skip_tarball) == 'true' || vars.SKIP_TARBALL == 'true' }}
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          tarball=$([ "$SKIP_TARBALL" = "true" ] && echo false || echo true)
          docker buildx build --platform linux/arm64 -f docker/deb.Dockerfile --build-arg TARBALL=$tarball \
            --output type=local,dest=dist .

      - uses: actions/upload-artifact@v3
        with:
          name: deb-arm64
          path: dist/

  # jpackage only makes an MSI on Windows, so this needs a Windows runner registered with the windows-latest:host label
  # (docs/releasing.md). Host mode reuses the machine between runs, so no Gradle or Kotlin daemon is left behind to
  # hold files open in the next run's checkout. It's skipped by the skip_windows input of a run by hand, or for tags by
  # setting the SKIP_WINDOWS variable to true
  msi:
    name: Desktop MSI (Windows)
    needs: version
    if: format('{0}', inputs.skip_windows) != 'true' && vars.SKIP_WINDOWS != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Package
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :composeApp:packageMsi

      - name: Collect it
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/TicketMan-*.msi dist/

      - uses: actions/upload-artifact@v3
        with:
          name: msi
          path: dist/

  # One jar for every desktop system (-PallPlatforms puts each one's Skia in), run with java -jar on Java 21. It's
  # skipped by the skip_desktop_jar input of a run by hand, or for tags by setting SKIP_DESKTOP_JAR to true
  desktop-jar:
    name: Desktop jar
    needs: version
    if: format('{0}', inputs.skip_desktop_jar) != 'true' && vars.SKIP_DESKTOP_JAR != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Package
        run: ./gradlew :composeApp:packageUberJarForCurrentOS -PallPlatforms

      - name: Collect it
        run: |
          mkdir -p dist
          cp composeApp/build/compose/jars/TicketMan-Desktop-*.jar dist/

      - uses: actions/upload-artifact@v3
        with:
          name: desktop-jar
          path: dist/

  # The server is released twice: with the web client built in (TicketMan-Server-Web-<version>.zip, image tags
  # <version> and latest, on Docker Hub <user>/ticketman) and without it (TicketMan-Server-<version>.zip, tags
  # <version>-noweb and latest-noweb, on Docker Hub <user>/ticketman-server with plain <version> and latest), where / is
  # a plain up check, each also as a jar run with java -jar (TicketMan-Server-Web-<version>.jar and
  # TicketMan-Server-<version>.jar). Each is skipped by its input of a run by hand, or for tags by setting
  # SKIP_SERVER_WEB or SKIP_SERVER_NOWEB to true; SKIP_SERVER_JARS (skip_server_jars) leaves out only the jars
  server-web:
    name: Server (with web client)
    needs: version
    if: format('{0}', inputs.skip_server_web) != 'true' && vars.SKIP_SERVER_WEB != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Build
        run: ./gradlew :server:installDist :server:distZip -PwithWeb

      - name: Collect it
        run: |
          mkdir -p dist
          cp server/build/distributions/TicketMan-Server-Web-*.zip dist/

      - name: Jar
        if: format('{0}', inputs.skip_server_jars) != 'true' && vars.SKIP_SERVER_JARS != 'true'
        run: |
          ./gradlew :server:buildFatJar -PwithWeb
          cp server/build/libs/TicketMan-Server-Web-*.jar dist/

      - uses: actions/upload-artifact@v3
        with:
          name: server-web
          path: dist/

      # Pushed for a tag to this Gitea's container registry when the REGISTRY_TOKEN secret (a token with
      # write:package) is set, and to Docker Hub when the DOCKERHUB_TOKEN secret (an access token with Read & Write)
      # and the DOCKERHUB_USERNAME variable are set. Needs a runner that can reach Docker. The host's Docker daemon
      # does the pushing, so when the runner knows Gitea by an internal name (like gitea:3000) set the REGISTRY
      # variable to Gitea's public HTTPS host (its ROOT_URL, like git.example.com)
      - name: Image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          tags=()
          if [ -n "$REGISTRY_TOKEN" ]; then
            registry="${REGISTRY:-${GITHUB_SERVER_URL#*://}}"
            registry="${registry#*://}"
            registry="${registry%/}"
            image="$registry/${GITHUB_REPOSITORY,,}"
            tags+=(-t "$image:$version")
            if [[ "$version" != *-* ]]; then tags+=(-t "$image:latest"); fi
            echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin
          fi
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "::error::DOCKERHUB_TOKEN is set but the DOCKERHUB_USERNAME variable isn't"
              exit 1
            fi
            hub="docker.io/${DOCKERHUB_USERNAME,,}/ticketman"
            tags+=(-t "$hub:$version")
            if [[ "$version" != *-* ]]; then tags+=(-t "$hub:latest"); fi
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::warning::No REGISTRY_TOKEN or DOCKERHUB_TOKEN secret, so no Docker image"
            exit 0
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
          builder=$(docker buildx create)
          trap 'docker buildx rm "$builder"' EXIT
          docker buildx build --builder "$builder" --platform linux/amd64,linux/arm64 -f server/Dockerfile \
            "${tags[@]}" --push .

  server-noweb:
    name: Server (no web client)
    needs: version
    if: format('{0}', inputs.skip_server_noweb) != 'true' && vars.SKIP_SERVER_NOWEB != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Build
        run: ./gradlew :server:installDist :server:distZip

      - name: Collect it
        run: |
          mkdir -p dist
          cp server/build/distributions/TicketMan-Server-[0-9]*.zip dist/

      - name: Jar
        if: format('{0}', inputs.skip_server_jars) != 'true' && vars.SKIP_SERVER_JARS != 'true'
        run: |
          ./gradlew :server:buildFatJar
          cp server/build/libs/TicketMan-Server-[0-9]*.jar dist/

      - uses: actions/upload-artifact@v3
        with:
          name: server-noweb
          path: dist/

      # Pushed like the one with the web client (see there), to <user>/ticketman-server on Docker Hub
      - name: Image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          tags=()
          if [ -n "$REGISTRY_TOKEN" ]; then
            registry="${REGISTRY:-${GITHUB_SERVER_URL#*://}}"
            registry="${registry#*://}"
            registry="${registry%/}"
            image="$registry/${GITHUB_REPOSITORY,,}"
            tags+=(-t "$image:$version-noweb")
            if [[ "$version" != *-* ]]; then tags+=(-t "$image:latest-noweb"); fi
            echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin
          fi
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "::error::DOCKERHUB_TOKEN is set but the DOCKERHUB_USERNAME variable isn't"
              exit 1
            fi
            hub="docker.io/${DOCKERHUB_USERNAME,,}/ticketman-server"
            tags+=(-t "$hub:$version")
            if [[ "$version" != *-* ]]; then tags+=(-t "$hub:latest"); fi
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::warning::No REGISTRY_TOKEN or DOCKERHUB_TOKEN secret, so no Docker image"
            exit 0
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
          builder=$(docker buildx create)
          trap 'docker buildx rm "$builder"' EXIT
          docker buildx build --builder "$builder" --platform linux/amd64,linux/arm64 -f server/Dockerfile \
            "${tags[@]}" --push .

  release:
    name: Publish
    needs: [version, packages, deb-arm64, msi, desktop-jar, server-web, server-noweb]
    # Publishes without whatever was skipped, but not when anything failed or was cancelled
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.version.result == 'success'
      && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
      && (needs.deb-arm64.result == 'success' || needs.deb-arm64.result == 'skipped')
      && (needs.msi.result == 'success' || needs.msi.result == 'skipped')
      && (needs.desktop-jar.result == 'success' || needs.desktop-jar.result == 'skipped')
      && (needs.server-web.result == 'success' || needs.server-web.result == 'skipped')
      && (needs.server-noweb.result == 'success' || needs.server-noweb.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
      - uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          files: dist/*
          # 0.x and -rc versions are betas
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
