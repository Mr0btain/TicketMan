# Builds the Linux packages and publishes a Gitea release when a v* tag is pushed (git tag v0.9.0 && git push origin
# v0.9.0). Run it by hand to build without publishing. The Windows MSI and macOS DMG need runners on those systems,
# which .github/workflows/release.yml has on GitHub. See docs/releasing.md
#
# Gitea only runs actions/upload-artifact and download-artifact v3, not v4
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^ticketman.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ticketman.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The APK and DEB are built on x86: the AAPT2 Gradle downloads doesn't run on ARM Linux, and the DEB is for the
  # runner's own architecture
  packages:
    name: Desktop DEB and Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37
      - uses: gradle/actions/setup-gradle@v4

      # jpackage makes the DEB with these
      - name: Packaging tools
        run: command -v dpkg-deb fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TICKETMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          TICKETMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TICKETMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TICKETMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:packageDeb :androidApp:assembleRelease

      - name: Name them
        run: |
          mkdir -p dist
          version="${{ needs.version.outputs.version }}"
          arch=$(dpkg --print-architecture)
          cp composeApp/build/compose/binaries/main/deb/*.deb "dist/TicketMan-$version-$arch.deb"
          apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          suffix=$([[ "$apk" == *unsigned* ]] && echo "-unsigned" || true)
          cp "$apk" "dist/TicketMan-$version$suffix.apk"

      - uses: actions/upload-artifact@v3
        with:
          name: packages
          path: dist/

  server:
    name: Server
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37
      - uses: gradle/actions/setup-gradle@v4

      - name: Build with the web client
        run: ./gradlew :server:installDist :server:distZip -PwithWeb

      - name: Name it
        run: |
          mkdir -p dist
          cp server/build/distributions/server-*.zip "dist/TicketMan-server-${{ needs.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v3
        with:
          name: server
          path: dist/

      # Pushed to this Gitea's container registry for a tag, when the REGISTRY_TOKEN secret (a token with
      # write:package) is set. Needs a runner that can reach Docker
      - name: Image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::warning::No REGISTRY_TOKEN secret, so no Docker image"
            exit 0
          fi
          registry="${GITHUB_SERVER_URL#*://}"
          image="$registry/${GITHUB_REPOSITORY,,}"
          version="${{ needs.version.outputs.version }}"
          tags=(-t "$image:$version")
          [[ "$version" != *-* ]] && tags+=(-t "$image:latest")
          echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$GITHUB_ACTOR" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -f server/Dockerfile "${tags[@]}" --push .

  release:
    name: Publish
    needs: [version, packages, server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
      - uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          files: dist/*
          # 0.x and -rc versions are betas
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
