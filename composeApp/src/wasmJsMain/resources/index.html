<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketMan</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script type="application/javascript">
        // Shown until the app draws (main.kt removes it), so a slow load or a failed start isn't a blank page
        function showStartProblem(text) {
            var box = document.getElementById("loading");
            if (box) {
                box.className = "problem";
                box.textContent = "TicketMan couldn't start: " + text +
                    ". Reload the page; if it keeps happening, try an up to date Chrome, Edge or Firefox, and check the browser's console.";
            }
        }
        window.addEventListener("error", function (event) { showStartProblem(event.message || "an error on the page"); });
        window.addEventListener("unhandledrejection", function (event) { showStartProblem(String(event.reason)); });
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="loading">Loading TicketMan…</div>
</body>
</html>
