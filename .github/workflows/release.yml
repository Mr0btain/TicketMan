# Builds every package (installers and tarballs, APK, jars, server zips and images with and without the web client)
# and publishes a GitHub release when a v* tag is pushed (git tag v0.8.0 && git push origin v0.8.0). Run it by hand
# (Actions > Release > Run workflow) to build without publishing. It makes the same files as
# .gitea/workflows/release.yml, plus the DMG and, when asked, the unsigned iOS app; Gitea doesn't read this folder while
# .gitea/workflows exists. See docs/releasing.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_arm64:
        description: Skip the arm64 DEB
        type: boolean
        default: false
      skip_amd64:
        description: Skip the amd64 DEB and the APK
        type: boolean
        default: false
      skip_windows:
        description: Skip the Windows MSI
        type: boolean
        default: false
      skip_mac:
        description: Skip the macOS DMG
        type: boolean
        default: false
      skip_tarball:
        description: Skip the Linux tarballs (the desktop app unpacked, beside each DEB)
        type: boolean
        default: false
      skip_desktop_jar:
        description: Skip the desktop jar
        type: boolean
        default: false
      skip_server_web:
        description: Skip the server with the web client (saves the few minute Wasm build)
        type: boolean
        default: false
      skip_server_noweb:
        description: Skip the server without the web client
        type: boolean
        default: false
      skip_server_jars:
        description: Skip the server jars (the zips and images are still built)
        type: boolean
        default: false
      build_ios:
        description: Build the unsigned iOS app (not yet tested, so off unless asked for)
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  # Also picks which installers to build, since a matrix entry can't be skipped on its own
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      desktop: ${{ steps.desktop.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^ticketman.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ticketman.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Each one is left out by its input on a run by hand, or for tags by its variable set to true
      - id: desktop
        name: Installers to build
        env:
          SKIP_WINDOWS: ${{ format('{0}', inputs.skip_windows) == 'true' || vars.SKIP_WINDOWS == 'true' }}
          SKIP_MAC: ${{ format('{0}', inputs.skip_mac) == 'true' || vars.SKIP_MAC == 'true' }}
          SKIP_AMD64: ${{ format('{0}', inputs.skip_amd64) == 'true' || vars.SKIP_AMD64 == 'true' }}
          SKIP_ARM64: ${{ format('{0}', inputs.skip_arm64) == 'true' || vars.SKIP_ARM64 == 'true' }}
        run: |
          entries=()
          [ "$SKIP_WINDOWS" != true ] && entries+=('{"os":"windows-latest","format":"msi","task":"packageMsi"}')
          [ "$SKIP_MAC" != true ] && entries+=('{"os":"macos-latest","format":"dmg","task":"packageDmg"}')
          [ "$SKIP_AMD64" != true ] && entries+=('{"os":"ubuntu-latest","format":"deb","task":"packageDeb"}')
          # Free for public repos; a private one needs ARM runners on its plan
          [ "$SKIP_ARM64" != true ] && entries+=('{"os":"ubuntu-24.04-arm","format":"deb","task":"packageDeb"}')
          echo "matrix={\"include\":[$(IFS=,; echo "${entries[*]}")]}" >> "$GITHUB_OUTPUT"

  # jpackage only builds installers for the system it runs on, so one runner per installer. The arm64 DEB is built
  # natively here, where Gitea emulates it. Beside each DEB goes a tarball of the same app (bin/TicketMan to start it)
  # for systems without dpkg, skipped by skip_tarball or SKIP_TARBALL
  desktop:
    name: Desktop (${{ matrix.format }}, ${{ matrix.os }})
    needs: version
    if: fromJSON(needs.version.outputs.desktop).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # jpackage makes the DEB with these
      - name: Packaging tools
        if: matrix.format == 'deb'
        run: command -v fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      # The build names each file (TicketMan-Linux-<version>-x64.deb, TicketMan-macOS-<version>-arm64.dmg, see
      # docs/releasing.md), so they're only collected
      - name: Package
        env:
          SKIP_TARBALL: ${{ format('{0}', inputs.skip_tarball) == 'true' || vars.SKIP_TARBALL == 'true' }}
        run: |
          tarball=$([ "${{ matrix.format }}" = deb ] && [ "$SKIP_TARBALL" != true ] && echo :composeApp:packageTarball || true)
          ./gradlew :composeApp:${{ matrix.task }} $tarball
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/${{ matrix.format }}/TicketMan-*.${{ matrix.format }} dist/
          if [ -n "$tarball" ]; then cp composeApp/build/compose/binaries/main/tar/TicketMan-*.tar.gz dist/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}-${{ runner.arch }}
          path: dist/

  # One jar for every desktop system (-PallPlatforms puts each one's Skia in), run with java -jar on Java 21
  desktop-jar:
    name: Desktop jar
    needs: version
    if: format('{0}', inputs.skip_desktop_jar) != 'true' && vars.SKIP_DESKTOP_JAR != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Package
        run: ./gradlew :composeApp:packageUberJarForCurrentOS -PallPlatforms

      - name: Collect it
        run: |
          mkdir -p dist
          cp composeApp/build/compose/jars/TicketMan-Desktop-*.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: dist/

  # Skipped with the amd64 DEB, as on Gitea where one job builds both
  android:
    name: Android
    needs: version
    if: format('{0}', inputs.skip_amd64) != 'true' && vars.SKIP_AMD64 != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The keystore as a base64 secret; without it the APK comes out unsigned (fine for a by-hand trial run)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TICKETMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The build names it TicketMan-Android-<version>.apk (-unsigned without a key)
      - name: Build
        env:
          TICKETMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TICKETMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TICKETMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/TicketMan-*.apk dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  # The server is released twice: with the web client built in (TicketMan-Server-Web-<version>.zip and .jar, ghcr.io
  # tags <version> and latest) and without it (TicketMan-Server-<version>.zip and .jar, ghcr.io tags <version>-noweb
  # and latest-noweb), where / is a plain up check. Images are pushed to ghcr.io only for a tag. Docker Hub is only
  # pushed to from the Gitea release
  server:
    name: Server (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: with web client, web: true, files: 'TicketMan-Server-Web-*', ghcr: '' }
          - { name: no web client, web: false, files: 'TicketMan-Server-[0-9]*', ghcr: '-noweb' }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A matrix entry can't be skipped with an if on the job, so each step checks this
      - id: skip
        name: Built this time?
        run: |
          if [ "${{ matrix.web }}" = true ]; then
            skip=${{ format('{0}', inputs.skip_server_web) == 'true' || vars.SKIP_SERVER_WEB == 'true' }}
          else
            skip=${{ format('{0}', inputs.skip_server_noweb) == 'true' || vars.SKIP_SERVER_NOWEB == 'true' }}
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "web=$([ "${{ matrix.web }}" = true ] && echo -PwithWeb || true)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'
      - uses: actions/setup-java@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.skip.outputs.skip != 'true'

      # The build names the zip and jar, so they're only collected
      - name: Build
        if: steps.skip.outputs.skip != 'true'
        run: |
          ./gradlew :server:installDist :server:distZip ${{ steps.skip.outputs.web }}
          mkdir -p dist
          cp server/build/distributions/${{ matrix.files }}.zip dist/

      - name: Jar
        if: steps.skip.outputs.skip != 'true' && format('{0}', inputs.skip_server_jars) != 'true' && vars.SKIP_SERVER_JARS != 'true'
        run: |
          ./gradlew :server:buildFatJar ${{ steps.skip.outputs.web }}
          cp server/build/libs/${{ matrix.files }}.jar dist/

      - uses: actions/upload-artifact@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          name: server${{ matrix.ghcr }}
          path: dist/

      # The image copies the server built above (see server/Dockerfile)
      - uses: docker/setup-qemu-action@v3
        if: steps.skip.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.skip.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        if: steps.skip.outputs.skip != 'true'
        run: |
          version="${{ needs.version.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ticketman"
          tags="$image:$version${{ matrix.ghcr }}"
          # Only a plain x.y.z is latest, never a -rc
          [[ "$version" != *-* ]] && tags="$tags,$image:latest${{ matrix.ghcr }}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.skip.outputs.skip != 'true'
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image.outputs.tags }}

  # An unsigned IPA, installed by sideloading it (AltStore, Sideloadly), which signs it with the person's own Apple ID.
  # Opt in with the build_ios input or the BUILD_IOS variable until the app has been tried on a device
  # (docs/roadmap.md); a failed iOS build doesn't stop the release
  ios:
    name: iOS (unsigned)
    needs: version
    if: format('{0}', inputs.build_ios) == 'true' || vars.BUILD_IOS == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Xcode's build phase runs Gradle for the Kotlin framework
      - name: Build
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package
        run: |
          mkdir -p dist Payload
          cp -R build/ios/Release-iphoneos/TicketMan.app Payload/
          zip -qr "dist/TicketMan-iOS-${{ needs.version.outputs.version }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/

  release:
    name: Publish
    needs: [version, desktop, desktop-jar, android, server, ios]
    # Publishes without whatever was skipped, but not when anything failed or was cancelled (iOS aside, see there)
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.version.result == 'success'
      && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
      && (needs.desktop-jar.result == 'success' || needs.desktop-jar.result == 'skipped')
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
      && needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 0.x and -rc versions are betas
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
