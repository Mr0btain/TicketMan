# Builds every package (installers, APK, jars, server zip and image) and publishes a GitHub release when a v* tag is pushed (git tag v0.8.0 && git push origin
# v0.8.0). Run it by hand (Actions > Release > Run workflow) to build everything without publishing. Gitea doesn't
# read this folder while .gitea/workflows exists; its own release.yml builds the Linux packages. See docs/releasing.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag matches gradle.properties
        run: |
          version=$(sed -n 's/^ticketman.version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ticketman.version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # jpackage only builds installers for the system it runs on, so one runner per installer
  desktop:
    name: Desktop (${{ matrix.format }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, format: msi, task: packageMsi }
          - { os: macos-latest, format: dmg, task: packageDmg }
          - { os: ubuntu-latest, format: deb, task: packageDeb }
          # Free for public repos; a private one needs ARM runners on its plan
          - { os: ubuntu-24.04-arm, format: deb, task: packageDeb }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      # jpackage makes the DEB with these
      - name: Packaging tools
        if: matrix.format == 'deb'
        run: command -v fakeroot >/dev/null || (sudo apt-get update && sudo apt-get install -y fakeroot dpkg-dev)

      - name: Package
        run: ./gradlew :composeApp:${{ matrix.task }}

      # The build names it for the runner (TicketMan-Windows-<version>-x64.msi, see docs/releasing.md)
      - name: Collect it
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/${{ matrix.format }}/TicketMan-*.${{ matrix.format }} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}-${{ runner.arch }}
          path: dist/

  # One jar for every desktop system (-PallPlatforms puts each one's Skia in), run with java -jar on Java 21
  desktop-jar:
    name: Desktop jar
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Package
        run: ./gradlew :composeApp:packageUberJarForCurrentOS -PallPlatforms

      - name: Collect it
        run: |
          mkdir -p dist
          cp composeApp/build/compose/jars/TicketMan-Desktop-*.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: dist/

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      # The keystore as a base64 secret; without it the APK comes out unsigned (fine for a by-hand trial run)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TICKETMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          TICKETMAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TICKETMAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TICKETMAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Collect it
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/TicketMan-*.apk dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  server:
    name: Server
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3: a commit, since act_runner can't resolve the v4 tag

      - name: Build with the web client
        run: ./gradlew :server:installDist :server:distZip :server:buildFatJar -PwithWeb

      - name: Collect them
        run: |
          mkdir -p dist
          cp server/build/distributions/TicketMan-Server-Web-*.zip dist/
          cp server/build/libs/TicketMan-Server-Web-*.jar dist/

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/

      # The image copies the server built above (see server/Dockerfile). Pushed only for a tag
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ticketman"
          version="${{ needs.version.outputs.version }}"
          tags="$image:$version"
          # Only a plain x.y.z is latest, never a -rc
          [[ "$version" != *-* ]] && tags="$tags,$image:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.image.outputs.tags }}

  release:
    name: Publish
    needs: [version, desktop, desktop-jar, android, server]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 0.x and -rc versions are betas
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
